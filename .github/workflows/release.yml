name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          python3 -m pip install --quiet 'reportlab>=4.0' 'pypdfium2>=4.0' 'python-docx>=1.1.0'
          python3 tests/test_parsecheck.py
      - name: Package .skill from tracked files
        run: bash scripts/package.sh
      - name: Create release with the .skill attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/resume-kit.skill \
            --title "${GITHUB_REF_NAME}" --generate-notes
